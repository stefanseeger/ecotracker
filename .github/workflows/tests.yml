name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Lint with ruff
        run: |
          ruff check custom_components/ecotracker/
          ruff format --check custom_components/ecotracker/

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --cov=custom_components/ecotracker --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  manifest-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Validate manifest.json
        run: |
          python -m json.tool custom_components/ecotracker/manifest.json > /dev/null
          echo "✓ manifest.json is valid"

      - name: Check manifest schema
        run: |
          python -c "
          import json
          with open('custom_components/ecotracker/manifest.json') as f:
              manifest = json.load(f)

          required_keys = ['domain', 'name', 'codeowners', 'version']
          for key in required_keys:
              assert key in manifest, f'Missing required key: {key}'

          assert manifest['domain'] == 'ecotracker', 'Domain mismatch'
          print('✓ manifest.json schema is valid')
          "
