name-template: 'v$NEXT_PATCH_VERSION'

categories:
  - title: '🚀 Features'
    labels:
      - enhancement
  - title: '🐛 Bug Fixes'
    labels:
      - bug
  - title: '🧪 Tests'
    labels:
      - test
  - title: '📚 Documentation'
    labels:
      - documentation

change-template: '- $TITLE (#$NUMBER) by @$AUTHOR'

no-changes-template: '- No changes'
